  - id: AI-55
    type: UNBLOCK
    title: "Fix broken fortnightly ISO-week gate in innovation-backlog-routine SKILL.md"
    detail: >
      The parity gate uses `Get-Date -UFormat %V`, which mis-computed the week on
      2026-07-12 (returned 29; actual ISO week 28) causing a wrongful SKIP of an
      on-week run; 2026-06-30 (odd week 27) ran when it should have skipped. Fix in
      C:\Users\alexa\.claude\scheduled-tasks\innovation-backlog-routine\SKILL.md:
      (a) replace %V with [System.Globalization.ISOWeek]::GetWeekOfYear((Get-Date));
      (b) anchor the fortnight to a date instead of week parity —
      floor((today - 2026-06-22).Days / 7) % 2 -eq 0 — so 53-week years don't produce
      back-to-back odd weeks / a 3-week gap. Evidence: fleet-exit-log.jsonl rows
      2026-06-30 (OK on odd week) and 2026-07-12 (SKIP logged "ISO week 29" on an even week).
    blocks: [innovation-backlog-cadence]
    raised_by: innovation-backlog-run-2026-07-17
