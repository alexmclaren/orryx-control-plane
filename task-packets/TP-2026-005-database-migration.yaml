objective: |
  Add audit tracking fields to patient table to comply with security policy:
  - createdAt (timestamp)
  - createdBy (user ID)
  - updatedAt (timestamp)
  - updatedBy (user ID)
  - version (for optimistic locking)

  Migrate existing ~500 patient records with default values.

  Zero data loss, minimal downtime (<5 minutes).

