target_schema:
  table: "patients"
  columns:
    - "id (UUID, PRIMARY KEY)"
    - "firstName (VARCHAR)"
    - "lastName (VARCHAR)"
    - "email (VARCHAR, UNIQUE)"
    - "dateOfBirth (DATE)"
    - "phone (VARCHAR)"
    - "address (TEXT)"
    - "createdAt (TIMESTAMP, NOT NULL)"
    - "createdBy (VARCHAR, NOT NULL)"
    - "updatedAt (TIMESTAMP, NOT NULL)"
    - "updatedBy (VARCHAR, NOT NULL)"
    - "version (INTEGER, NOT NULL)"

migration_script:
  up: |
    -- migration: add-audit-fields-to-patients
    -- date: 2026-04-26

    BEGIN;

    -- Add audit columns
    ALTER TABLE patients
      ADD COLUMN createdAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      ADD COLUMN createdBy VARCHAR(255) NOT NULL DEFAULT 'system-migration',
      ADD COLUMN updatedAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      ADD COLUMN updatedBy VARCHAR(255) NOT NULL DEFAULT 'system-migration',
      ADD COLUMN version INTEGER NOT NULL DEFAULT 1;

    -- Update existing records with approximated timestamps
    -- (Use earliest possible timestamp for existing records)
    UPDATE patients
    SET
      createdAt = COALESCE(createdAt, '2025-01-01 00:00:00'),
      updatedAt = COALESCE(updatedAt, CURRENT_TIMESTAMP);

    -- Add trigger to auto-update updatedAt on changes
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updatedAt = CURRENT_TIMESTAMP;
      NEW.version = OLD.version + 1;
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TRIGGER update_patients_updated_at
      BEFORE UPDATE ON patients
      FOR EACH ROW
      EXECUTE FUNCTION update_updated_at_column();

    COMMIT;

  down: |
    -- rollback: add-audit-fields-to-patients

    BEGIN;

    -- Drop trigger
    DROP TRIGGER IF EXISTS update_patients_updated_at ON patients;
    DROP FUNCTION IF EXISTS update_updated_at_column();

    -- Remove audit columns
    ALTER TABLE patients
      DROP COLUMN IF EXISTS createdAt,
      DROP COLUMN IF EXISTS createdBy,
      DROP COLUMN IF EXISTS updatedAt,
      DROP COLUMN IF EXISTS updatedBy,
      DROP COLUMN IF EXISTS version;

    COMMIT;

validation_queries:
  record_count: |
    -- Verify record count unchanged
    SELECT COUNT(*) FROM patients;
    -- Expected: Same as before migration

  audit_fields_populated: |
    -- Verify all audit fields populated
    SELECT COUNT(*) FROM patients
    WHERE createdAt IS NULL
       OR createdBy IS NULL
       OR updatedAt IS NULL
       OR updatedBy IS NULL
       OR version IS NULL;
    -- Expected: 0

  data_integrity: |
    -- Verify no data corruption
    SELECT id, firstName, lastName, email
    FROM patients
    WHERE firstName IS NULL OR lastName IS NULL OR email IS NULL;
    -- Expected: 0 (or same as before if NULLs were allowed)

  trigger_works: |
    -- Test trigger by updating a record
    UPDATE patients SET firstName = firstName WHERE id = '<test-id>';
    SELECT version, updatedAt FROM patients WHERE id = '<test-id>';
    -- Expected: version = 2, updatedAt = recent timestamp

