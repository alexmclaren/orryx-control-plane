implementation_hints:
  database_indexes:
    file: "src/models/Patient.ts"
    pattern: |
      @Entity()
      @Index(['firstName', 'lastName'])
      @Index(['email'])
      class Patient {
        @Column()
        @Index()
        firstName: string;

        @Column()
        @Index()
        lastName: string;

        @Column()
        @Index()
        email: string;
      }

  pagination:
    file: "src/api/patients/search.ts"
    pattern: |
      export async function searchPatients(
        query: string,
        page: number = 1,
        limit: number = 20
      ) {
        const offset = (page - 1) * limit;

        const [results, total] = await Patient.findAndCount({
          where: {
            [Op.or]: [
              { firstName: { [Op.iLike]: `%${query}%` } },
              { lastName: { [Op.iLike]: `%${query}%` } },
              { email: { [Op.iLike]: `%${query}%` } },
            ],
          },
          limit,
          offset,
          order: [['lastName', 'ASC'], ['firstName', 'ASC']],
        });

        return {
          results,
          pagination: {
            page,
            limit,
            total,
            totalPages: Math.ceil(total / limit),
          },
        };
      }

  frontend_virtualization:
    file: "src/components/PatientSearch.tsx"
    pattern: |
      import { FixedSizeList } from 'react-window';

      function PatientSearchResults({ results }) {
        return (
          <FixedSizeList
            height={600}
            itemCount={results.length}
            itemSize={60}
          >
            {({ index, style }) => (
              <div style={style}>
                <PatientCard patient={results[index]} />
              </div>
            )}
          </FixedSizeList>
        );
      }

risks:
  - risk: "Indexes slow down write operations"
