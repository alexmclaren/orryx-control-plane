investigation_required:
  current_implementation:
  - Check AuditLog model definition
  - Check database column type
  - Find all places using AuditLog.create()
  - Check if logout.ts and login.ts affected
  solution_options:
  - 'Option A: Change new Date() to new Date(Date.now()) with UTC conversion'
  - 'Option B: Use Date.toISOString() before storing'
  - 'Option C: Database-level DEFAULT to timezone(''UTC'', now())'
  - 'Option D: Combination of application + database changes'
  backward_compatibility:
  - Will existing audit logs be affected?
  - Do we need migration for old records?
  - Can we detect and handle both formats?
implementation_hints:
  database:
    file: migrations/XXXXXX-fix-audit-log-timezone.ts
    pattern: 'ALTER TABLE audit_logs

      ALTER COLUMN timestamp TYPE TIMESTAMPTZ

      USING timestamp AT TIME ZONE ''UTC'';

      '
  model:
    file: src/models/AuditLog.ts
    pattern: "timestamp: {\n  type: DataTypes.DATE,  // Already timezone-aware in\
      \ Sequelize\n  allowNull: false,\n  defaultValue: DataTypes.NOW,  // Uses UTC\
      \ by default\n}\n"
  application:
    file: src/api/auth/logout.ts, login.ts
    pattern: "// Ensure Date objects are created correctly\nawait AuditLog.create({\n\
      \  userId,\n  action: 'logout',\n  timestamp: new Date(),  // Already UTC if\
      \ DB configured correctly\n});\n"
  testing:
    file: src/models/AuditLog.test.ts
    pattern: "it('should store timestamps in UTC', () => {\n  const now = new Date();\n\
      \  const log = await AuditLog.create({ timestamp: now });\n\n  // Verify stored\
      \ time matches UTC\n  expect(log.timestamp.getTimezoneOffset()).toBe(0);\n \
      \ expect(log.timestamp.toISOString()).toBe(now.toISOString());\n});\n"
risks:
- risk: Existing audit logs may have inconsistent timestamps
  mitigation: Document the change, no migration needed (future logs will be correct)
- risk: Breaking change to AuditLog interface
  mitigation: Maintain same interface, only internal handling changes
- risk: Performance impact from timezone conversions
  mitigation: Measure performance, should be negligible (<1ms)
- risk: Display layer may show wrong times
  mitigation: "Add tests for UTC \xE2\u2020\u2019 local conversion in UI components"
