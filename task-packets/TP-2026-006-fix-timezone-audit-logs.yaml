task_id: TP-2026-006
title: Fix timezone handling in audit logs
created_by: founder
created_date: '2026-04-26'
priority: high
status: completed
execution_pattern: standard
target:
  product: pillarworks
  repo: pillarworks
  branch: main
objective: 'Fix critical bug in audit logging system where timestamps are stored in

  local time instead of UTC, violating compliance requirements.


  Current behavior:

  - AuditLog.create() uses new Date() which captures local time

  - Database stores timestamps without timezone information

  - Queries and reports show inconsistent times based on server timezone


  Expected behavior:

  - All audit log timestamps stored in UTC

  - Timezone conversions handled at display layer only

  - Database stores consistent, unambiguous timestamps


  This is a compliance issue: Security policy requires 10-year audit

  retention with unambiguous timestamps for legal/regulatory purposes.

  '
context_refs:
  governance:
  - 'orryx-governance/security/security-policy.md (Section 5: Audit Logging)'
  standards:
  - 'orryx-standards/CLAUDE.md (Section 2.1: Patient Data)'
  knowledge:
  - orryx-knowledge/patterns/audit-logging-pattern.md
requirements:
  functional:
  - All new audit log entries use UTC timestamps
  - Existing code updated to use UTC
  - Database schema supports timezone-aware timestamps
  - Display layer converts UTC to local time if needed
  non_functional:
  - No breaking changes to AuditLog model interface
  - Backward compatible with existing audit logs
  - Performance impact minimal (<5ms per log entry)
acceptance_criteria:
- AuditLog.create() stores timestamps in UTC
- Database column type supports timezone (TIMESTAMPTZ or equivalent)
- All existing audit logging code updated
- Tests verify UTC storage
- Tests verify timezone conversions are correct
- All tests pass (unit + integration)
- Test coverage >80%
- No security issues introduced
