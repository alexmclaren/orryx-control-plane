# Orryx Repository Registry
# Master list of all Orryx repositories
#
# Classification (production-bearing / archived / ...) is owned by
# D:\state\repo-classification.json. `status` here must not contradict it.

version: "1.1"
last_updated: "2026-09-17T00:00:00Z"
updated_by: "claude (reconcile against repo-classification.json, pending founder review)"

# CONTROL & GOVERNANCE REPOS
control:
  - repo_name: orryx-control-plane
    type: control-plane
    owner: founder
    status: active
    url: https://github.com/orryx/orryx-control-plane
    local_path: ../orryx-control-plane
    description: "Central orchestration and task management"
    access: all_agents

  - repo_name: orryx-governance
    type: governance
    owner: founder
    status: active
    url: https://github.com/orryx/orryx-governance
    local_path: ../orryx-governance
    description: "Security, compliance, and financial policies"
    access: read_all_write_security

  - repo_name: orryx-standards
    type: standards
    owner: founder
    status: active
    url: https://github.com/alexmclaren/orryx-standards
    local_path: ../orryx-standards
    description: "Technical standards and patterns"
    sync_to:
      - pillarworks
      - triora
      - orryx
      - orryx-flow
    access: read_all_write_architect

  - repo_name: orryx-knowledge
    type: knowledge-base
    owner: all_teams
    status: active
    url: https://github.com/orryx/orryx-knowledge
    local_path: ../orryx-knowledge
    description: "Domain knowledge, patterns, and lessons learned"
    access: read_all_write_all

# PRODUCT REPOS
products:
  - repo_name: pillarworks
    type: product
    owner: pillarworks_team
    status: active
    url: https://github.com/orryx/pillarworks
    local_path: ../pillarworks-build-mvp
    description: "GP-facing CDSS system"
    tech_stack:
      frontend: react-typescript-vite
      backend: node-typescript-express
      database: postgresql
    inherits_from:
      - orryx-standards
      - orryx-governance
      - orryx-knowledge

  - repo_name: triora
    type: product
    owner: triora_team
    status: active  # repo-classification.json: Clinical.Trials = production-bearing
    url: https://github.com/alexmclaren/Clinical_trials
    local_path: ../Clinical.Trials  # there is no ../triora checkout
    description: "Clinical trial patient-matching platform (triora.io)"
    tech_stack:
      frontend: react-typescript-vite
      backend: python-fastapi
      database: postgresql
    inherits_from:
      - orryx-standards
      - orryx-governance
      - orryx-knowledge

  - repo_name: orryx
    type: product
    owner: platform_team
    status: planned
    url: https://github.com/orryx/orryx
    local_path: ../orryx
    description: "Parent platform"
    inherits_from:
      - orryx-standards
      - orryx-governance
      - orryx-knowledge

  - repo_name: orryx-flow
    type: product
    owner: platform_team
    status: archived
    # Archived on GitHub; reclassified 2026-09-01 in repo-classification.json.
    # This records current disposition, NOT a retirement decision: retire vs
    # archived-in-error is open as ESC-CEO-099 (8 unmerged PRs, two of them
    # clinical-safety). If un-archived, this returns to active.
    escalation: ESC-CEO-099
    url: https://github.com/alexmclaren/orryx-flow
    local_path: ../orryx-flow
    description: "Fertility/clinical ops platform (workflow engine)"
    inherits_from:
      - orryx-standards
      - orryx-governance
      - orryx-knowledge

  - repo_name: care-companion
    type: product
    owner: founder
    status: unclassified  # absent from repo-classification.json
    url: https://github.com/alexmclaren/companion
    local_path: ../companion
    description: "AI Care Companion product monorepo (the build)"
    tech_stack:
      frontend: react-typescript-vite
      backend: python-fastapi
    related:
      - care-companion-venture
    inherits_from:
      - orryx-standards
      - orryx-governance
      - orryx-knowledge

  - repo_name: care-companion-venture
    type: venture-docs
    owner: founder
    status: unclassified  # absent from repo-classification.json
    url: https://github.com/alexmclaren/care-companion-venture
    local_path: ../care-companion-venture
    description: "Care Companion strategy, research, regulatory and decisions (no code)"
    related:
      - care-companion

  - repo_name: property-maintenance-os
    type: product
    owner: founder
    status: unclassified  # repo-classification.json unclassified_pending, ESC-CEO-133
    url: https://github.com/alexmclaren/property-maintenance-os
    local_path: ../property-maintenance-os
    description: "Property maintenance OS: venture discovery plus Next.js webapp"
    tech_stack:
      frontend: react-typescript-nextjs

# SHARED CAPABILITY REPOS (Deferred)
shared:
  - repo_name: orryx-packages
    type: shared-packages
    status: deferred
    trigger: "When code duplicated across 2+ products"

  - repo_name: orryx-design-system
    type: ui-components
    status: deferred
    trigger: "When UI components duplicated across 2+ products"

  - repo_name: orryx-infra
    type: infrastructure
    status: deferred
    trigger: "When infrastructure patterns repeated"

  - repo_name: orryx-services
    type: backend-services
    status: deferred
    trigger: "When backend logic should be shared service"
